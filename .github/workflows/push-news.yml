name: push-news
# Instant alerts: when a data update touches news.json / reports.json, tell the alerts Worker right away (before GitHub Pages has even rebuilt).
# Free (public repo). Needs the repository secret PUSH_NEWS_KEY (same value as the Worker's PUSH_NEWS_KEY secret); without it this job does nothing.
# Reads public data only; never writes to the repo; never fails the push (the Worker's cron stays as fallback).
on:
  push:
    branches: [main]
    paths: ['news.json', 'reports.json']
  workflow_dispatch:
    inputs:
      test_title:
        description: 'Optional: send a test alert with this title instead (reaches devices that have "כל חדשה שעולה" on)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 2 }
      - name: tell the Worker
        env:
          PUSH_NEWS_KEY: ${{ secrets.PUSH_NEWS_KEY }}
          BEFORE: ${{ github.event.before }}
          TEST_TITLE: ${{ github.event.inputs.test_title }}
        run: |
          if [ -n "$BEFORE" ] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null || true; fi
          if [ -n "$TEST_TITLE" ]; then node scripts/push-news.cjs --test "$TEST_TITLE"; else node scripts/push-news.cjs --before "${BEFORE:-HEAD~1}" --after "$GITHUB_SHA"; fi
